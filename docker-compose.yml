services:
  nginx:
    image: nginx:1.27-alpine
    container_name: rinha-nginx
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api01
      - api02
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"

  api01:
    build:
      context: .
      dockerfile: Dockerfile
    image: rinha-api:latest
    container_name: rinha-api-01
    environment:
      - PORT=8080
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

  api02:
    build:
      context: .
      dockerfile: Dockerfile
    image: rinha-api:latest
    container_name: rinha-api-02
    environment:
      - PORT=8080
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"

networks:
  rinha:
    driver: bridge